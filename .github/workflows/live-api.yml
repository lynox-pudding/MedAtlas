name: Live upstream API verification
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
jobs:
  upstream-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Test eleven public-source API adapters
        run: node tests/live-smoke.mjs
      - name: Store source-level API audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-status
          path: live-status.json
          if-no-files-found: warn
          retention-days: 14
