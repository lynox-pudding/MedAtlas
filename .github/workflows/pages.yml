name: Publish MedAtlas frontend
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: medatlas-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("public/config.js",`window.MEDATLAS_API_BASE=${JSON.stringify((process.env.API_BASE_URL||"").replace(/\\/$/,""))};\n`)'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
